version: '3.9'
services:
  django:
    build: ./django_backend
    volumes:
      - ./django_backend:/app
    ports:
      - "8000:8000"
    env_file:
      - .env

  redis:
    image: redis:7

  fastapi:
    build: ./fastapi_microservice
    ports:
      - "9000:9000"
    volumes:
      - ./fastapi_microservice:/app
    env_file:
      - .env
